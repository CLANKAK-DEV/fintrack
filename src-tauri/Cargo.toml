[package]
name = "fintrack"
version = "1.0.0"
description = "FinTrack — personal finance & productivity tracker"
authors = ["FinTrack"]
edition = "2021"

[lib]
name = "fintrack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
